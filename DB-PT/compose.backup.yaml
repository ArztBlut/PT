# Optional nightly database dumps, for hosts where you have no shell and no cron
# (a Portainer-only deployment, for instance). Add this file alongside the engine
# file when you deploy:
#
#   In Portainer, set the compose path to compose.yaml and add this one under
#   "Additional paths", or deploy the combined file from the command line:
#   docker compose -f compose.yaml -f compose.backup.yaml up -d
#
# Dumps land in the registry-backups volume. Browse or download them in
# Portainer under Volumes, or copy them out with:
#   docker run --rm -v personnel-registry_registry-backups:/b -v "$PWD":/out alpine \
#     sh -c 'cp /b/*.sql.gz /out/'

services:
  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD on the stack before deploying.}
      DB_NAME: ${DB_NAME:-personnel}
      DB_USER: ${DB_USER:-personnel}
      KEEP: ${BACKUP_KEEP:-14}
      INTERVAL: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - registry-backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Backups every $${INTERVAL}s, keeping $${KEEP}."
        while true; do
          FILE="/backups/personnel-$$(date +%Y%m%d-%H%M%S).sql.gz"
          if pg_dump -h db -U "$${DB_USER}" -d "$${DB_NAME}" --clean --if-exists | gzip > "$${FILE}"; then
            if [ -s "$${FILE}" ]; then
              echo "$$(date -Is) wrote $${FILE}"
            else
              rm -f "$${FILE}"; echo "$$(date -Is) dump was empty, discarded" >&2
            fi
          else
            rm -f "$${FILE}"; echo "$$(date -Is) dump failed" >&2
          fi
          ls -1t /backups/personnel-*.sql.gz 2>/dev/null | tail -n +$$(( $${KEEP} + 1 )) | xargs -r rm -f
          sleep "$${INTERVAL}"
        done
    networks: [registry]

volumes:
  registry-backups:
