# Personnel Registry — PostgreSQL.
#
# For MariaDB, deploy compose.mariadb.yaml instead.
# To build from source rather than pull a published image, use compose.build.yaml.
#
# Required environment variable: DB_PASSWORD
# Everything else has a working default. In Portainer, set these under
# "Environment variables" on the stack.

name: personnel-registry

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/OWNER/personnel-registry:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_ENGINE: postgres
      DB_HOST: db
      DB_NAME: ${DB_NAME:-personnel}
      DB_USER: ${DB_USER:-personnel}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD on the stack before deploying.}
      # Optional. Leave unset and the app generates a session key on first start
      # and keeps it in the database, so sessions survive a redeploy.
      SECRET_KEY: ${SECRET_KEY:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      # Optional. Leave unset and a password is generated and written to the
      # app container's log the first time it starts.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      APP_TITLE: ${APP_TITLE:-Personnel Registry}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      SESSION_HTTPS_ONLY: ${SESSION_HTTPS_ONLY:-false}
    ports:
      # 5060 as specified, plus an alternate because browsers refuse to open
      # 5060. Both serve the same interface. See the README.
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-5060}:8080"
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_ALT_PORT:-8060}:8080"
    networks: [registry]

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-personnel}
      POSTGRES_USER: ${DB_USER:-personnel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD on the stack before deploying.}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    # PostgreSQL 18 moved PGDATA to /var/lib/postgresql/<major>/docker and moved
    # its declared volume to /var/lib/postgresql. Mounting the old
    # /var/lib/postgresql/data path here would silently lose data, which is also
    # why the major version is pinned.
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "${DB_BIND_ADDRESS:-127.0.0.1}:${DB_PORT:-5061}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -q"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [registry]

volumes:
  postgres-data:

networks:
  registry:
