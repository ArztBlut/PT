<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <link rel="icon" href="/static/favicon.svg?v={{v}}" type="image/svg+xml">
  <link rel="preload" href="/static/fonts/barlow-semi-condensed-semibold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/css/app.css?v={{v}}">
</head>
<body>
  <div class="stage">
    <div class="box" data-view="all">
      <header class="topbar">
        <a class="brand" href="#/all">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>{{title}}</span>
        </a>
        <div id="account"></div>
      </header>
      <div class="frame">
        <nav class="sidebar" id="sidebar" aria-label="Registry"></nav>
        <main class="main" id="main" tabindex="-1">
          <p class="loading">Loading records</p>
        </main>
      </div>
    </div>
  </div>
  <div class="toasts" id="toasts" popover="manual" aria-live="polite"></div>
  <script type="module" src="/static/js/app.js?v={{v}}"></script>
</body>
</html>
